    :root {
      --bg: #1e1e1e;
      --bg2: #252526;
      --bg3: #2d2d30;
      --border: #3e3e42;
      --text: #d4d4d4;
      --muted: #858585;
      --primary: #007acc;
      --green: #4ec9b0;
      --red: #f48771;
      --yellow: #dcdcaa;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', 'Monaco', 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ════════════════════════════════════════════════════════════
       HEADER
    ════════════════════════════════════════════════════════════ */
    header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 10px 15px;
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .logo {
      font-weight: 700;
      font-size: 14px;
      color: var(--primary);
    }

    .header-tabs {
      display: flex;
      gap: 5px;
    }

    .header-btn {
      background: none;
      border: none;
      color: var(--muted);
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
      transition: 0.15s;
    }

    .header-btn:hover {
      background: var(--bg3);
      color: var(--text);
    }

    .header-btn.active {
      background: var(--bg3);
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
    }

    /* ════════════════════════════════════════════════════════════
       MAIN LAYOUT
    ════════════════════════════════════════════════════════════ */
    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ════════════════════════════════════════════════════════════
       SIDEBAR
    ════════════════════════════════════════════════════════════ */
    .sidebar {
      width: 250px;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 5px;
    }

    .file-item {
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.1s;
      margin-bottom: 2px;
    }

    .file-item:hover {
      background: var(--bg3);
      color: var(--text);
    }

    .file-item.active {
      background: var(--primary);
      color: #fff;
    }

    /* ════════════════════════════════════════════════════════════
       EDITOR
    ════════════════════════════════════════════════════════════ */
    .editor-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .editor-toolbar {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .editor-toolbar span {
      font-size: 12px;
      color: var(--muted);
      font-family: 'Courier New', monospace;
    }

    .editor-area {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    textarea {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: none;
      padding: 15px;
      resize: none;
      font-size: 13px;
      font-family: 'Courier New', monospace;
      line-height: 1.6;
      outline: none;
      tab-size: 2;
    }

    textarea::selection {
      background: var(--primary);
      color: #fff;
    }

    /* ════════════════════════════════════════════════════════════
       PREVIEW
    ════════════════════════════════════════════════════════════ */
    .preview-panel {
      width: 50%;
      background: var(--bg);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .preview-header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .preview-content {
      flex: 1;
      overflow: auto;
      padding: 15px;
    }

    #preview-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    /* ════════════════════════════════════════════════════════════
       IA PANEL
    ════════════════════════════════════════════════════════════ */
    .ia-panel {
      width: 350px;
      background: var(--bg2);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .ia-header {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
    }

    .ia-slots {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .slot {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      font-size: 11px;
    }

    .slot-title {
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 5px;
    }

    .slot-input {
      width: 100%;
      padding: 6px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 11px;
      font-family: 'Courier New', monospace;
      margin-bottom: 5px;
      outline: none;
    }

    .slot-input:focus {
      border-color: var(--primary);
    }

    .slot-status {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .slot-btn {
      width: 100%;
      padding: 6px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }

    .slot-btn:hover {
      background: #0098ff;
    }

    .slot-btn.inactive {
      background: var(--border);
      color: var(--muted);
      cursor: not-allowed;
    }

    /* ════════════════════════════════════════════════════════════
       IA CHAT
    ════════════════════════════════════════════════════════════ */
    .ia-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-top: 1px solid var(--border);
    }

    .ia-messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ia-msg {
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.5;
      word-break: break-word;
    }

    .ia-msg.user {
      background: var(--primary);
      color: #fff;
      align-self: flex-end;
      max-width: 80%;
    }

    .ia-msg.assistant {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      align-self: flex-start;
      max-width: 80%;
    }

    .ia-input-area {
      padding: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 6px;
    }

    .ia-input-area textarea {
      flex: 1;
      min-height: 60px;
      max-height: 100px;
      padding: 8px;
      font-size: 12px;
    }

    .ia-send-btn {
      padding: 8px 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
      align-self: flex-end;
    }

    .ia-send-btn:hover {
      background: #0098ff;
    }

    .ia-send-btn:disabled {
      background: var(--border);
      cursor: not-allowed;
    }

    /* ════════════════════════════════════════════════════════════
       BUTTONS
    ════════════════════════════════════════════════════════════ */
    .btn {
      background: var(--bg3);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn:hover {
      background: var(--border);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: #0098ff;
    }

    /* ════════════════════════════════════════════════════════════
       MODALS
    ════════════════════════════════════════════════════════════ */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.open {
      display: flex;
    }

    .modal-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      width: min(500px, 95vw);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 15px;
      color: var(--primary);
    }

    .modal-input {
      width: 100%;
      padding: 8px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 10px;
      outline: none;
    }

    .modal-input:focus {
      border-color: var(--primary);
    }

    .modal-buttons {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .modal-buttons button {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-buttons .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .modal-buttons .btn-secondary {
      background: var(--bg3);
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* ════════════════════════════════════════════════════════════
       TOAST
    ════════════════════════════════════════════════════════════ */
    #toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px 16px;
      background: var(--green);
      color: #000;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      z-index: 2000;
      opacity: 0;
      transition: opacity 0.3s;
    }

    #toast.show {
      opacity: 1;
    }

    @media (max-width: 1024px) {
      .preview-panel {
        display: none;
      }

      .ia-panel {
        width: 300px;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 150px;
      }

      .ia-panel {
        width: 200px;
      }
    }
  &amp;lt;/style&amp;gt;
&amp;lt;/head&amp;gt;

// ════════════════════════════════════════════════════════════
// UTILITIES
// ════════════════════════════════════════════════════════════
function qs(s) { return document.querySelector(s); }
function qsa(s) { return document.querySelectorAll(s); }
function ls(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch { } }

function showToast(msg) {
  const t = qs('#toast') || (() =&amp;gt; {
    const el = document.createElement('div');
    el.id = 'toast';
    document.body.appendChild(el);
    return el;
  })();
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() =&amp;gt; t.classList.remove('show'), 2500);
}

function openModal(id) { qs('#' + id).classList.add('open'); }
function closeModal(id) { qs('#' + id).classList.remove('open'); }

let files = {};
let currentFile = null;
let currentView = 'editor';

function initEditor() {
  const saved = ls('mini-vs-files');
  if (saved) files = JSON.parse(saved);

  if (!Object.keys(files).length) {
    files['index.html'] = '&amp;lt;!DOCTYPE html&amp;gt;\n&amp;lt;html&amp;gt;\n&amp;lt;head&amp;gt;\n  &amp;lt;title&amp;gt;Meu Projeto&amp;lt;/title&amp;gt;\n  &amp;lt;link rel=&amp;quot;stylesheet&amp;quot; href=&amp;quot;style.css&amp;quot;&amp;gt;\n&amp;lt;/head&amp;gt;\n&amp;lt;body&amp;gt;\n  &amp;lt;h1&amp;gt;Olá, Mundo!&amp;lt;/h1&amp;gt;\n  &amp;lt;script src=&amp;quot;script.js&amp;quot;&amp;gt;&amp;lt;\/script&amp;gt;\n&amp;lt;/body&amp;gt;\n&amp;lt;/html&amp;gt;';
    files['style.css'] = 'body {\n  font-family: Arial, sans-serif;\n  background: #f0f0f0;\n  padding: 20px;\n}\n\nh1 {\n  color: #333;\n}';
    files['script.js'] = 'console.log(&amp;quot;Projeto iniciado!&amp;quot;);\n\nfunction saudacao() {\n  console.log(&amp;quot;Olá!&amp;quot;);\n}\n\nsaudacao();';
  }

  renderFileList();
  if (Object.keys(files).length) openFile(Object.keys(files)[0]);
  initIASlots();
}

function renderFileList() {
  const list = qs('#file-list');
  list.innerHTML = Object.keys(files).map(f =&amp;gt; `
    &amp;lt;div class=&amp;quot;file-item ${f === currentFile ? 'active' : ''}&amp;quot; onclick=&amp;quot;openFile('${f}')&amp;quot;&amp;gt;
      &amp;lt;span&amp;gt;${getFileIcon(f)}&amp;lt;/span&amp;gt;
      &amp;lt;span&amp;gt;${f}&amp;lt;/span&amp;gt;
    &amp;lt;/div&amp;gt;
  `).join('');
}

function getFileIcon(name) {
  const ext = name.split('.').pop() || '';
  const icons = { html: '🌐', css: '🎨', js: '📜', json: '📋', md: '📝', py: '🐍', txt: '📄' };
  return icons[ext] || '📄';
}

function openFile(name) {
  if (currentFile &amp;amp;&amp;amp; files[currentFile] !== undefined) {
    files[currentFile] = qs('#code-editor').value;
  }
  currentFile = name;
  qs('#code-editor').value = files[name] || '';
  qs('#current-file').textContent = name;
  renderFileList();
  updatePreview();
}

function onCodeChange() {
  if (currentFile) {
    files[currentFile] = qs('#code-editor').value;
    updatePreview();
  }
}

function updatePreview() {
  if (!currentFile || !currentFile.endsWith('.html')) {
    qs('#preview-panel').style.display = 'none';
    return;
  }
  qs('#preview-panel').style.display = 'flex';
  const iframe = qs('#preview-iframe');
  const code = files[currentFile] || '';
  iframe.srcdoc = code;
}

function handleTab(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    const ta = e.target;
    const s = ta.selectionStart;
    ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(ta.selectionEnd);
    ta.selectionStart = ta.selectionEnd = s + 2;
    onCodeChange();
  }
}

function newFile() {
  openModal('new-file-modal');
}

function createNewFile() {
  const name = qs('#new-file-name').value.trim();
  if (!name) return;
  files[name] = '';
  renderFileList();
  openFile(name);
  closeModal('new-file-modal');
  qs('#new-file-name').value = '';
  saveProject();
}

function deleteFile() {
  if (!currentFile || !confirm(`Deletar &amp;quot;${currentFile}&amp;quot;?`)) return;
  delete files[currentFile];
  currentFile = null;
  renderFileList();
  if (Object.keys(files).length) openFile(Object.keys(files)[0]);
  else qs('#code-editor').value = '';
  saveProject();
}

function saveProject() {
  if (currentFile) files[currentFile] = qs('#code-editor').value;
  lsSet('mini-vs-files', JSON.stringify(files));
  showToast('💾 Salvo!');
}

async function downloadProject() {
  if (!window.JSZip) {
    showToast('JSZip não carregado');
    return;
  }
  if (currentFile) files[currentFile] = qs('#code-editor').value;

  const zip = new JSZip();
  for (const [name, content] of Object.entries(files)) {
    zip.file(name, content);
  }
  const blob = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'projeto.zip';
  a.click();
  showToast('📥 Projeto baixado!');
}

function openProject() {
  qs('#file-input').click();
}

async function handleFileUpload(e) {
  const file = e.target.files[0];
  if (!file || !window.JSZip) return;

  try {
    const zip = await JSZip.loadAsync(file);
    files = {};
    for (const [path, obj] of Object.entries(zip.files)) {
      if (!obj.dir) {
        files[path] = await obj.async('string');
      }
    }
    renderFileList();
    if (Object.keys(files).length) openFile(Object.keys(files)[0]);
    saveProject();
    showToast('📂 Projeto importado!');
  } catch (err) {
    showToast('Erro ao importar: ' + err.message);
  }
  e.target.value = '';
}

function switchView(view) {
  currentView = view;
  qsa('.header-btn').forEach(b =&amp;gt; b.classList.remove('active'));
  event.target.classList.add('active');
  // Aqui você pode adicionar lógica para mostrar/ocultar painéis
}

let iaSlots = JSON.parse(ls('mini-vs-ia-slots') || 'null') || [
  { name: 'Slot 1', key: '', provider: '', model: '', active: false },
  { name: 'Slot 2', key: '', provider: '', model: '', active: false },
  { name: 'Slot 3', key: '', provider: '', model: '', active: false },
  { name: 'Slot 4', key: '', provider: '', model: '', active: false },
];

let iaHistory = [];
let iaSending = false;

function detectProvider(key) {
  if (!key) return null;
  const k = key.trim();
  if (k.startsWith('sk-ant-')) return { p: 'anthropic', m: 'claude-haiku-4-20250514' };
  if (k.startsWith('AIza') || k.startsWith('ya29.')) return { p: 'google', m: 'gemini-2.0-flash' };
  if (k.startsWith('gsk_')) return { p: 'groq', m: 'llama-3.3-70b-versatile' };
  if (k.startsWith('sk-')) return { p: 'openai', m: 'gpt-4o-mini' };
  return null;
}

function initIASlots() {
  const container = qs('#ia-slots');
  container.innerHTML = iaSlots.map((slot, i) =&amp;gt; `
    &amp;lt;div class=&amp;quot;slot&amp;quot;&amp;gt;
      &amp;lt;div class=&amp;quot;slot-title&amp;quot;&amp;gt;${slot.name}&amp;lt;/div&amp;gt;
      &amp;lt;input class=&amp;quot;slot-input&amp;quot; id=&amp;quot;slot-key-${i}&amp;quot; type=&amp;quot;password&amp;quot; placeholder=&amp;quot;Cole sua chave aqui...&amp;quot; value=&amp;quot;${slot.key}&amp;quot; oninput=&amp;quot;updateSlot(${i})&amp;quot;&amp;gt;
      &amp;lt;div class=&amp;quot;slot-status&amp;quot; id=&amp;quot;slot-status-${i}&amp;quot;&amp;gt;${slot.provider ? `✅ ${slot.provider.toUpperCase()}` : '⚠️ Sem chave'}&amp;lt;/div&amp;gt;
      &amp;lt;button class=&amp;quot;slot-btn ${slot.active ? '' : 'inactive'}&amp;quot; onclick=&amp;quot;toggleSlot(${i})&amp;quot; id=&amp;quot;slot-btn-${i}&amp;quot;&amp;gt;
        ${slot.active ? '✓ Ativo' : 'Ativar'}
      &amp;lt;/button&amp;gt;
    &amp;lt;/div&amp;gt;
  `).join('');
}

function updateSlot(i) {
  const key = qs(`#slot-key-${i}`).value;
  const det = detectProvider(key);
  iaSlots[i].key = key;
  iaSlots[i].provider = det?.p || '';
  iaSlots[i].model = det?.m || '';
  qs(`#slot-status-${i}`).textContent = det ? `✅ ${det.p.toUpperCase()} - ${det.m}` : '⚠️ Sem chave';
  lsSet('mini-vs-ia-slots', JSON.stringify(iaSlots));
}

function toggleSlot(i) {
  if (!iaSlots[i].key) return;
  iaSlots.forEach((s, j) =&amp;gt; s.active = (j === i) ? !s.active : false);
  initIASlots();
  lsSet('mini-vs-ia-slots', JSON.stringify(iaSlots));
}

function getActiveSlot() {
  return iaSlots.find(s =&amp;gt; s.active &amp;amp;&amp;amp; s.key) || null;
}

function addIAMsg(role, text) {
  const container = qs('#ia-messages');
  const msg = document.createElement('div');
  msg.className = `ia-msg ${role}`;
  msg.textContent = text;
  container.appendChild(msg);
  container.scrollTop = container.scrollHeight;
}

async function sendIA() {
  const slot = getActiveSlot();
  if (!slot) {
    showToast('⚠️ Configure uma chave de IA primeiro');
    return;
  }

  const prompt = qs('#ia-prompt').value.trim();
  if (!prompt) return;

  iaSending = true;
  qs('#ia-send-btn').disabled = true;

  addIAMsg('user', prompt);
  qs('#ia-prompt').value = '';
  iaHistory.push({ role: 'user', content: prompt });

  const thinking = document.createElement('div');
  thinking.className = 'ia-msg assistant';
  thinking.textContent = '⏳ Pensando...';
  qs('#ia-messages').appendChild(thinking);

  try {
    const reply = await callIA(slot, iaHistory);
    thinking.textContent = reply;
    iaHistory.push({ role: 'assistant', content: reply });
  } catch (err) {
    thinking.textContent = '❌ Erro: ' + err.message;
  } finally {
    iaSending = false;
    qs('#ia-send-btn').disabled = false;
  }
}

async function callIA(slot, messages) {
  const provider = slot.provider;
  const model = slot.model;
  const key = slot.key;

  if (provider === 'anthropic') {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model,
        max_tokens: 1024,
        messages: messages.filter(m =&amp;gt; m.role !== 'system'),
        temperature: 0.7
      })
    });
    if (!r.ok) throw new Error(`Erro ${r.status}`);
    const d = await r.json();
    return d.content?.[0]?.text || 'Sem resposta';
  }

  if (provider === 'google') {
    const m2 = messages.filter(m =&amp;gt; m.role !== 'system').map(m =&amp;gt; ({
      role: m.role === 'assistant' ? 'model' : 'user',
      parts: [{ text: m.content }]
    }));
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: m2,
        generationConfig: { maxOutputTokens: 1024, temperature: 0.7 }
      })
    });
    if (!r.ok) throw new Error(`Erro ${r.status}`);
    const d = await r.json();
    return d.candidates?.[0]?.content?.parts?.[0]?.text || 'Sem resposta';
  }

  // OpenAI-compatible (OpenAI, Groq, etc)
  const url = provider === 'groq' 
    ? 'https://api.groq.com/openai/v1/chat/completions'
    : 'https://api.openai.com/v1/chat/completions';

  const r = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${key}`
    },
    body: JSON.stringify({
      model,
      messages,
      max_tokens: 1024,
      temperature: 0.7
    })
  });
  if (!r.ok) throw new Error(`Erro ${r.status}`);
  const d = await r.json();
  return d.choices?.[0]?.message?.content || 'Sem resposta';
}

      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      resize: vertical;
    }

    .preview-header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      display: flex;
      gap: 8px;
    }

    .preview-header button {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      padding: 2px 6px;
    }

    .preview-header button:hover {
      color: var(--text);
    }

    .preview-content {
      flex: 1;
      overflow: auto;
      padding: 10px;
      background: #fff;
    }

    #preview-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    .terminal-output {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      background: var(--bg);
      color: var(--green);
      font-size: 12px;
      font-family: 'Courier New', monospace;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .terminal-input {
      display: flex;
      gap: 6px;
      padding: 8px 10px;
      border-top: 1px solid var(--border);
      background: var(--bg2);
    }

    .terminal-input input {
      flex: 1;
      background: var(--bg);
      color: var(--green);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px;
      font-size: 12px;
      font-family: 'Courier New', monospace;
      outline: none;
    }

    .terminal-input button {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 11px;
      cursor: pointer;
    }

    /* ════════════════════════════════════════════════════════════
       IA PANEL (EXPANDIDO)
    ════════════════════════════════════════════════════════════ */
    .ia-panel {
      width: 400px;
      background: var(--bg2);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .ia-header {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ia-tabs {
      display: flex;
      gap: 4px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .ia-tab {
      padding: 4px 10px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      color: var(--muted);
      transition: 0.15s;
    }

    .ia-tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .ia-tab:hover {
      color: var(--text);
    }

    .ia-content {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .ia-content.active {
      display: flex;
    }

    /* IA SLOTS */
    .ia-slots {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .slot {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      font-size: 11px;
    }

    .slot-title {
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .slot-input {
      width: 100%;
      padding: 6px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 11px;
      font-family: 'Courier New', monospace;
      margin-bottom: 6px;
      outline: none;
    }

    .slot-input:focus {
      border-color: var(--primary);
    }

    .slot-status {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 6px;
      padding: 4px;
      background: var(--bg);
      border-radius: 3px;
    }

    .slot-model {
      font-size: 10px;
      color: var(--yellow);
      margin-bottom: 6px;
    }

    .slot-btn {
      width: 100%;
      padding: 6px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }

    .slot-btn:hover {
      background: #0098ff;
    }

    .slot-btn.inactive {
      background: var(--border);
      color: var(--muted);
      cursor: not-allowed;
    }

    /* IA CHAT */
    .ia-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .ia-messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ia-msg {
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.5;
      word-break: break-word;
      max-width: 95%;
    }

    .ia-msg.user {
      background: var(--primary);
      color: #fff;
      align-self: flex-end;
    }

    .ia-msg.assistant {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      align-self: flex-start;
    }

    .ia-input-area {
      padding: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ia-input-area textarea {
      flex: 1;
      min-height: 50px;
      max-height: 80px;
      padding: 8px;
      font-size: 12px;
      resize: none;
    }

    .ia-send-btn {
      padding: 6px 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }

    .ia-send-btn:hover {
      background: #0098ff;
    }

    .ia-send-btn:disabled {
      background: var(--border);
      cursor: not-allowed;
    }

    /* ════════════════════════════════════════════════════════════
       BUTTONS
    ════════════════════════════════════════════════════════════ */
    .btn {
      background: var(--bg3);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn:hover {
      background: var(--border);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: #0098ff;
    }

    /* ════════════════════════════════════════════════════════════
       MODALS
    ════════════════════════════════════════════════════════════ */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.open {
      display: flex;
    }

    .modal-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      width: min(500px, 95vw);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 15px;
      color: var(--primary);
    }

    .modal-input {
      width: 100%;
      padding: 8px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 10px;
      outline: none;
    }

    .modal-input:focus {
      border-color: var(--primary);
    }

    .modal-buttons {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .modal-buttons button {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-buttons .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .modal-buttons .btn-secondary {
      background: var(--bg3);
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* ════════════════════════════════════════════════════════════
       TOAST
    ════════════════════════════════════════════════════════════ */
    #toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px 16px;
      background: var(--green);
      color: #000;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      z-index: 2000;
      opacity: 0;
      transition: opacity 0.3s;
    }

    #toast.show {
      opacity: 1;
    }

    @media (max-width: 1200px) {
      .ia-panel {
        width: 350px;
      }
    }

    @media (max-width: 1024px) {
      .preview-panel {
        height: 150px;
      }

      .ia-panel {
        width: 300px;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 150px;
      }

      .ia-panel {
        width: 200px;
      }

      .preview-panel {
        height: 100px;
      }
    }
  &amp;lt;/style&amp;gt;
&amp;lt;/head&amp;gt;

// UTILITIES
// ════════════════════════════════════════════════════════════
function qs(s) { return document.querySelector(s); }
function qsa(s) { return document.querySelectorAll(s); }
function ls(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch { } }

function showToast(msg) {
  const t = qs('#toast') || (() =&amp;gt; {
    const el = document.createElement('div');
    el.id = 'toast';
    document.body.appendChild(el);
    return el;
  })();
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() =&amp;gt; t.classList.remove('show'), 2500);
}

function openModal(id) { qs('#' + id).classList.add('open'); }
function closeModal(id) { qs('#' + id).classList.remove('open'); }

// FILE TREE STRUCTURE

let fileTree = {};
let currentFile = null;
let currentView = 'editor';

function initEditor() {
  const saved = ls('mini-vs-files-tree');
  if (saved) {
    fileTree = JSON.parse(saved);
  } else {
    fileTree = {
      'index.html': '&amp;lt;!DOCTYPE html&amp;gt;\n&amp;lt;html&amp;gt;\n&amp;lt;head&amp;gt;\n  &amp;lt;title&amp;gt;Meu Projeto&amp;lt;/title&amp;gt;\n  &amp;lt;link rel=&amp;quot;stylesheet&amp;quot; href=&amp;quot;style.css&amp;quot;&amp;gt;\n&amp;lt;/head&amp;gt;\n&amp;lt;body&amp;gt;\n  &amp;lt;h1&amp;gt;Olá, Mundo!&amp;lt;/h1&amp;gt;\n  &amp;lt;script src=&amp;quot;script.js&amp;quot;&amp;gt;&amp;lt;\/script&amp;gt;\n&amp;lt;/body&amp;gt;\n&amp;lt;/html&amp;gt;',
      'style.css': 'body {\n  font-family: Arial, sans-serif;\n  background: #f0f0f0;\n  padding: 20px;\n}\n\nh1 {\n  color: #333;\n}',
      'script.js': 'console.log(&amp;quot;Projeto iniciado!&amp;quot;);\n\nfunction saudacao() {\n  console.log(&amp;quot;Olá!&amp;quot;);\n}\n\nsaudacao();',
      'src': {

      }

  initIASlots();
  updateLineNumbers();
}

function renderFileTree() {
  const tree = qs('#file-tree');
  tree.innerHTML = renderTreeNode(fileTree, '');
}

function renderTreeNode(node, path) {
  let html = '';
  for (const [name, content] of Object.entries(node)) {
    const fullPath = path ? `${path}/${name}` : name;
    const isFolder = typeof content === 'object' &amp;amp;&amp;amp; !Array.isArray(content);
    
    if (isFolder) {
      html += `
        &amp;lt;div class=&amp;quot;folder-item&amp;quot; onclick=&amp;quot;toggleFolder(this)&amp;quot;&amp;gt;
          &amp;lt;div class=&amp;quot;folder-toggle&amp;quot;&amp;gt;▶&amp;lt;/div&amp;gt;
          &amp;lt;span&amp;gt;📁 ${name}&amp;lt;/span&amp;gt;
        &amp;lt;/div&amp;gt;
        &amp;lt;div class=&amp;quot;folder-children&amp;quot; data-path=&amp;quot;${fullPath}&amp;quot;&amp;gt;
          ${renderTreeNode(content, fullPath)}
        &amp;lt;/div&amp;gt;
      `;
    } else {
      const ext = name.split('.').pop() || '';
      html += `
        &amp;lt;div class=&amp;quot;file-item ${ext} ${currentFile === fullPath ? 'active' : ''}&amp;quot; onclick=&amp;quot;openFile('${fullPath}')&amp;quot;&amp;gt;
          &amp;lt;span class=&amp;quot;file-icon&amp;quot;&amp;gt;${getFileIcon(name)}&amp;lt;/span&amp;gt;
          &amp;lt;span&amp;gt;${name}&amp;lt;/span&amp;gt;
        &amp;lt;/div&amp;gt;
      `;
    }
  }
  return html;
}

function toggleFolder(el) {
  const toggle = el.querySelector('.folder-toggle');
  const children = el.nextElementSibling;
  if (children &amp;amp;&amp;amp; children.classList.contains('folder-children')) {
    children.classList.toggle('open');
    toggle.textContent = children.classList.contains('open') ? '▼' : '▶';
  }
}

function getFileIcon(name) {
  const ext = name.split('.').pop() || '';
  const icons = {
    html: '🌐', css: '🎨', js: '📜', ts: '📘', jsx: '⚛️', tsx: '⚛️',
    json: '📋', md: '📝', py: '🐍', java: '☕', cpp: '⚙️', c: '⚙️',
    go: '🐹', rs: '🦀', php: '🐘', rb: '💎', sh: '🐚', sql: '🗄️',
    xml: '📄', yaml: '⚙️', txt: '📄'
  };
  return icons[ext] || '📄';
}

function openFile(path) {
  if (currentFile &amp;amp;&amp;amp; currentFile !== path) {
    const content = qs('#code-editor').value;
    setFileContent(currentFile, content);
  }
  currentFile = path;
  const content = getFileContent(path);
  qs('#code-editor').value = content || '';
  qs('#current-file').textContent = path;
  renderFileTree();
  updateLineNumbers();
  updatePreview();
}

function getFileContent(path) {
  const parts = path.split('/');
  let node = fileTree;
  for (const part of parts) {
    if (node[part] !== undefined) {
      node = node[part];
    } else {
      return '';
    }
  }
  return typeof node === 'string' ? node : '';
}

function setFileContent(path, content) {
  const parts = path.split('/');
  let node = fileTree;
  for (let i = 0; i &amp;lt; parts.length - 1; i++) {
    if (!node[parts[i]]) node[parts[i]] = {};
    node = node[parts[i]];
  }
  node[parts[parts.length - 1]] = content;
}

function onCodeChange() {
  if (currentFile) {
    setFileContent(currentFile, qs('#code-editor').value);
    updateLineNumbers();
    updatePreview();
  }
}

function updateLineNumbers() {
  const code = qs('#code-editor').value;
  const lines = code.split('\n').length;
  const lineNumbers = Array.from({length: lines}, (_, i) =&amp;gt; i + 1).join('\n');
  qs('#line-numbers').textContent = lineNumbers;
}

function updatePreview() {
  if (!currentFile || !currentFile.endsWith('.html')) {
    qs('#preview-panel').style.display = 'none';
    return;
  }
  qs('#preview-panel').style.display = 'flex';
  const code = qs('#code-editor').value;
  qs('#preview-iframe').srcdoc = code;
}

function handleTab(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    const ta = e.target;
    const s = ta.selectionStart;
    ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(ta.selectionEnd);
    ta.selectionStart = ta.selectionEnd = s + 2;
    onCodeChange();
  }
}

function deleteFile() {
  if (!currentFile || !confirm(`Deletar &amp;quot;${currentFile}&amp;quot;?`)) return;
  const parts = currentFile.split('/');
  let node = fileTree;
  for (let i = 0; i &amp;lt; parts.length - 1; i++) {

async function downloadProject() {
  if (!window.JSZip) {
    showToast('JSZip não carregado');
    return;
  }
  if (currentFile) {
    setFileContent(currentFile, qs('#code-editor').value);
  }

  const zip = new JSZip();
  const addToZip = (node, path = '') =&amp;gt; {
    for (const [name, content] of Object.entries(node)) {
      const fullPath = path ? `${path}/${name}` : name;
      if (typeof content === 'object' &amp;amp;&amp;amp; !Array.isArray(content)) {
        addToZip(content, fullPath);
      } else {
        zip.file(fullPath, content);
      }
    }
  };
  addToZip(fileTree);

  const blob = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'projeto.zip';
  a.click();
  showToast('📥 Projeto baixado!');
}

function openProject() {
  qs('#file-input').click();
}

async function handleFileUpload(e) {
  const file = e.target.files[0];
  if (!file || !window.JSZip) return;

  try {
    const zip = await JSZip.loadAsync(file);
    fileTree = {};
    
    const processZip = async (zipFolder, targetObj) =&amp;gt; {
      for (const [path, obj] of Object.entries(zipFolder.files)) {
        if (obj.dir) continue;
        const parts = path.split('/').filter(p =&amp;gt; p);
        let node = targetObj;
        for (let i = 0; i &amp;lt; parts.length - 1; i++) {
          if (!node[parts[i]]) node[parts[i]] = {};
          node = node[parts[i]];
        }
        node[parts[parts.length - 1]] = await obj.async('string');
      }
    };

    await processZip(zip, fileTree);
    renderFileTree();
    if (Object.keys(fileTree).length) {
      const firstFile = Object.keys(fileTree)[0];
      openFile(firstFile);
    }
    saveProject();
    showToast('📂 Projeto importado!');
  } catch (err) {
    showToast('Erro ao importar: ' + err.message);
  }
  e.target.value = '';
}

let terminalHistory = [];
let terminalIndex = -1;

function runTerminalCmd() {
  const input = qs('#terminal-cmd');
  const cmd = input.value.trim();
  if (!cmd) return;

  const output = qs('#terminal-output');
  terminalHistory.push(cmd);
  terminalIndex = terminalHistory.length;

  output.textContent += `$ ${cmd}\n`;

  // Simular comandos comuns
  let result = '';
  if (cmd === 'help') {
    result = `Comandos disponíveis:\n  help - mostra esta ajuda\n  clear - limpa o terminal\n  node -v - versão do Node\n  npm -v - versão do npm\n  ls - lista arquivos\n  pwd - diretório atual\n  echo [texto] - escreve texto`;
  } else if (cmd === 'clear') {
    output.textContent = '';
    input.value = '';
    return;
  } else if (cmd === 'node -v') {
    result = 'v18.16.0';
  } else if (cmd === 'npm -v') {
    result = '9.6.7';
  } else if (cmd === 'ls' || cmd === 'dir') {
    result = Object.keys(fileTree).join('\n');
  } else if (cmd === 'pwd') {
    result = '/projeto';
  } else if (cmd.startsWith('echo ')) {
    result = cmd.substring(5);
  } else if (cmd.startsWith('node ')) {
    result = `Executando: ${cmd}\n[Simulado - Node.js não disponível no navegador]`;
  } else if (cmd.startsWith('npm ')) {
    result = `Executando: ${cmd}\n[Simulado - npm não disponível no navegador]`;
  } else {
    result = `Comando não reconhecido: ${cmd}`;
  }

  output.textContent += result + '\n\n';
  output.scrollTop = output.scrollHeight;
  input.value = '';
}

let iaSlots = JSON.parse(ls('mini-vs-ia-slots') || 'null') || [
  { name: 'Slot 1', key: '', provider: '', model: '', active: false },
  { name: 'Slot 2', key: '', provider: '', model: '', active: false },
  { name: 'Slot 3', key: '', provider: '', model: '', active: false },
  { name: 'Slot 4', key: '', provider: '', model: '', active: false },
];

let iaHistory = [];
let iaSending = false;

function detectProvider(key) {
  if (!key) return null;
  const k = key.trim();
  if (k.startsWith('sk-ant-')) return { p: 'anthropic', m: 'claude-haiku-4-20250514', n: 'Claude' };
  if (k.startsWith('AIza') || k.startsWith('ya29.')) return { p: 'google', m: 'gemini-2.0-flash', n: 'Gemini' };
  if (k.startsWith('gsk_')) return { p: 'groq', m: 'llama-3.3-70b-versatile', n: 'Groq' };
  if (k.startsWith('sk-or-')) return { p: 'openrouter', m: 'openai/gpt-4o-mini', n: 'OpenRouter' };
  if (k.startsWith('sk-')) return { p: 'openai', m: 'gpt-4o-mini', n: 'OpenAI' };
  if (k.startsWith('pplx-')) return { p: 'perplexity', m: 'sonar-pro', n: 'Perplexity' };
  return null;
}

function initIASlots() {
  const container = qs('#ia-slots');
  container.innerHTML = iaSlots.map((slot, i) =&amp;gt; `
    &amp;lt;div class=&amp;quot;slot&amp;quot;&amp;gt;
      &amp;lt;div class=&amp;quot;slot-title&amp;quot;&amp;gt;
        ${slot.name}
        &amp;lt;span style=&amp;quot;font-size: 9px; color: var(--muted);&amp;quot;&amp;gt;${slot.active ? '✓' : ''}&amp;lt;/span&amp;gt;
      &amp;lt;/div&amp;gt;
      &amp;lt;input class=&amp;quot;slot-input&amp;quot; id=&amp;quot;slot-key-${i}&amp;quot; type=&amp;quot;password&amp;quot; placeholder=&amp;quot;Cole sua chave aqui...&amp;quot; value=&amp;quot;${slot.key}&amp;quot; oninput=&amp;quot;updateSlot(${i})&amp;quot;&amp;gt;
      &amp;lt;div class=&amp;quot;slot-status&amp;quot; id=&amp;quot;slot-status-${i}&amp;quot;&amp;gt;${slot.provider ? `✅ ${slot.provider.toUpperCase()}` : '⚠️ Sem chave'}&amp;lt;/div&amp;gt;
      &amp;lt;div class=&amp;quot;slot-model&amp;quot; id=&amp;quot;slot-model-${i}&amp;quot;&amp;gt;${slot.model ? `📦 ${slot.model}` : ''}&amp;lt;/div&amp;gt;
      &amp;lt;button class=&amp;quot;slot-btn ${slot.active ? '' : 'inactive'}&amp;quot; onclick=&amp;quot;toggleSlot(${i})&amp;quot; id=&amp;quot;slot-btn-${i}&amp;quot;&amp;gt;
        ${slot.active ? '✓ Ativo' : 'Ativar'}
      &amp;lt;/button&amp;gt;
    &amp;lt;/div&amp;gt;
  `).join('');
}

function updateSlot(i) {
  const key = qs(`#slot-key-${i}`).value;
  const det = detectProvider(key);
  iaSlots[i].key = key;
  iaSlots[i].provider = det?.p || '';
  iaSlots[i].model = det?.m || '';
  qs(`#slot-status-${i}`).textContent = det ? `✅ ${det.n}` : '⚠️ Sem chave';
  qs(`#slot-model-${i}`).textContent = det ? `📦 ${det.m}` : '';
  lsSet('mini-vs-ia-slots', JSON.stringify(iaSlots));
}

function toggleSlot(i) {
  if (!iaSlots[i].key) return;
  iaSlots.forEach((s, j) =&amp;gt; s.active = (j === i) ? !s.active : false);
  initIASlots();
  lsSet('mini-vs-ia-slots', JSON.stringify(iaSlots));
}

function getActiveSlot() {
  return iaSlots.find(s =&amp;gt; s.active &amp;amp;&amp;amp; s.key) || null;
}

function switchIATab(tab) {
  const slots = qs('#ia-slots-content');

    chat.classList.add('active');

  }
}

function addIAMsg(role, text) {
  const container = qs('#ia-messages');
  const msg = document.createElement('div');
  msg.className = `ia-msg ${role}`;
  msg.textContent = text;
  container.appendChild(msg);
  container.scrollTop = container.scrollHeight;
}

async function sendIA() {
  const slot = getActiveSlot();
  if (!slot) {
    showToast('⚠️ Configure uma chave de IA primeiro');
    return;
  }

  const prompt = qs('#ia-prompt').value.trim();
  if (!prompt) return;

  iaSending = true;
  qs('#ia-send-btn').disabled = true;

  addIAMsg('user', prompt);
  qs('#ia-prompt').value = '';
  iaHistory.push({ role: 'user', content: prompt });

  const thinking = document.createElement('div');
  thinking.className = 'ia-msg assistant';
  thinking.textContent = '⏳ Pensando...';
  qs('#ia-messages').appendChild(thinking);

  try {
    const reply = await callIA(slot, iaHistory);
    thinking.textContent = reply;
    iaHistory.push({ role: 'assistant', content: reply });
  } catch (err) {
    thinking.textContent = '❌ Erro: ' + err.message;
  } finally {
    iaSending = false;
    qs('#ia-send-btn').disabled = false;
  }
}

async function callIA(slot, messages) {
  const provider = slot.provider;
  const model = slot.model;
  const key = slot.key;

  if (provider === 'anthropic') {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model,
        max_tokens: 1024,
        messages: messages.filter(m =&amp;gt; m.role !== 'system'),
        temperature: 0.7
      })
    });
    if (!r.ok) throw new Error(`Erro ${r.status}`);
    const d = await r.json();
    return d.content?.[0]?.text || 'Sem resposta';
  }

  if (provider === 'google') {
    const m2 = messages.filter(m =&amp;gt; m.role !== 'system').map(m =&amp;gt; ({
      role: m.role === 'assistant' ? 'model' : 'user',
      parts: [{ text: m.content }]
    }));
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: m2,
        generationConfig: { maxOutputTokens: 1024, temperature: 0.7 }
      })
    });
    if (!r.ok) throw new Error(`Erro ${r.status}`);
    const d = await r.json();
    return d.candidates?.[0]?.content?.parts?.[0]?.text || 'Sem resposta';
  }

  // OpenAI-compatible
  const urls = {
    groq: 'https://api.groq.com/openai/v1/chat/completions',
    openrouter: 'https://openrouter.ai/api/v1/chat/completions',
    perplexity: 'https://api.perplexity.ai/chat/completions',
    openai: 'https://api.openai.com/v1/chat/completions'
  };

  const r = await fetch(urls[provider] || urls.openai, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${key}`
    },
    body: JSON.stringify({
      model,
      messages,
      max_tokens: 1024,
      temperature: 0.7
    })
  });
  if (!r.ok) throw new Error(`Erro ${r.status}`);
  const d = await r.json();
  return d.choices?.[0]?.message?.content || 'Sem resposta';
}

/* MAIN */
.main{display:flex;flex:1;overflow:hidden;}

/* EDITOR */
.editor-panel{display:flex;flex-direction:column;width:38%;border-right:1px solid var(--border);transition:width .3s;min-width:0;}
.editor-panel.hidden{display:none;}
.editor-panel.full{width:100%;}
.editor-wrap{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;}
.editor-container{flex:1;position:relative;overflow:hidden;}
.editor-textarea{width:100%;height:100%;resize:none;background:var(--bg);color:var(--text);font-family:'Cascadia Code','Fira Code','Consolas',monospace;font-size:12px;line-height:1.6;padding:10px 10px 10px 44px;border:none;outline:none;tab-size:2;position:absolute;inset:0;}
.line-numbers{position:absolute;left:0;top:0;bottom:0;width:36px;background:rgba(30,41,59,.6);padding:10px 4px 10px 0;text-align:right;font-family:'Consolas',monospace;font-size:11px;line-height:1.6;color:var(--text2);opacity:.6;overflow:hidden;pointer-events:none;user-select:none;z-index:1;}

/* QUICK EDIT PANEL */
.quick-edit-bar{display:flex;gap:3px;padding:5px 8px;background:var(--bg3);border-bottom:1px solid var(--border);flex-shrink:0;align-items:center;font-size:11px;}
.quick-edit-input{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:5px;font-size:11px;flex:1;outline:none;font-family:monospace;}
.quick-edit-input:focus{border-color:var(--accent);}
.quick-edit-actions{display:flex;gap:2px;}

/* PREVIEW */
.preview-panel{display:flex;flex-direction:column;flex:1;min-width:0;border-right:1px solid var(--border);transition:all .3s;}
.preview-panel.minimized{flex:0 0 60px;}
.preview-panel.minimized .preview-frame{display:none;}
.preview-panel.minimized .preview-header{cursor:pointer;}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.preview-frame{flex:1;border:none;background:#fff;}
.preview-header{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;justify-content:space-between;}
.preview-header-left{display:flex;align-items:center;gap:6px;}
.preview-header-right{display:flex;gap:3px;}

/* CHAT IA */
.chat-panel{display:flex;flex-direction:column;width:300px;flex-shrink:0;}
.chat-panel.hidden{display:none;}
.chat-panel.wide{width:420px;}
.chat-header{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;}
.chat-header-left{display:flex;align-items:center;gap:6px;}
.chat-messages{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:7px;}
.msg{padding:8px 10px;border-radius:8px;font-size:11.5px;line-height:1.5;word-break:break-word;}
.msg-user{background:#1e3a8a;color:#fff;align-self:flex-end;max-width:92%;}
.msg-ai{background:#111827;border:1px solid var(--bg3);color:var(--text);align-self:flex-start;max-width:98%;white-space:pre-wrap;}
.msg-sys{background:var(--bg2);border:1px solid var(--border);color:#4b5563;font-size:10px;align-self:center;text-align:center;padding:4px 8px;border-radius:5px;}
.apply-btn{display:block;width:100%;margin-top:7px;padding:6px;background:#15803d;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:11px;font-weight:700;}
.apply-btn:hover{background:#16a34a;}
.chat-bottom{padding:7px;background:var(--bg2);border-top:1px solid var(--border);display:flex;gap:5px;flex-shrink:0;}
#chatInput{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:6px 8px;color:var(--text);font-size:11px;outline:none;resize:none;font-family:inherit;}
#chatInput:focus{border-color:#2563eb;}
#chatSend{background:#1d4ed8;color:#fff;border:none;border-radius:7px;padding:6px 10px;cursor:pointer;font-size:15px;}
#chatSend:hover{background:#2563eb;}
#chatSend:disabled{background:var(--bg3);cursor:not-allowed;}

/* MODAIS */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(3px);}
.overlay.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px;width:90%;max-width:460px;max-height:82vh;overflow-y:auto;}
.modal h3{font-size:15px;margin-bottom:12px;color:var(--accent);}
.minput{width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:12px;margin-bottom:10px;outline:none;font-family:inherit;}
.minput:focus{border-color:var(--accent);}

/* SALVOS */
.sitem{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-bottom:5px;cursor:pointer;transition:all .15s;}
.sitem:hover{border-color:var(--accent);background:var(--bg3);}
.sitem-name{font-size:12px;font-weight:600;}
.sitem-meta{font-size:10px;color:var(--text2);}
.sitem-actions{display:flex;gap:2px;flex-shrink:0;}

/* FULLSCREEN EDITOR */
#fsModal{display:none;position:fixed;inset:0;background:var(--bg);z-index:999;flex-direction:column;}
#fsModal.open{display:flex;}
#fsBar{background:var(--bg2);padding:7px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
#fsEditor{flex:1;width:100%;background:var(--bg);color:var(--text);border:none;outline:none;padding:18px;font-family:'Cascadia Code','Consolas',monospace;font-size:14px;line-height:1.7;resize:none;}

/* LOADING */
.dots{display:flex;gap:4px;padding:8px 10px;}
.dot{width:7px;height:7px;background:#7c3aed;border-radius:50%;animation:blink .8s infinite;}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* TOAST */
.toast{position:fixed;bottom:16px;right:16px;background:var(--bg2);border:1px solid var(--accent);border-radius:9px;padding:10px 16px;font-size:12px;font-weight:600;color:var(--accent2);z-index:2000;transform:translateY(80px);opacity:0;transition:all .3s;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}

/* STATUS */
#saveStatus{font-size:10px;color:#4ade80;}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}

@media(max-width:768px){
  .main{flex-direction:column;}
  .editor-panel{width:100%!important;height:40%;border-right:none;border-bottom:1px solid var(--border);}
  .preview-panel{height:35%;}
  .chat-panel{width:100%;height:25%;}
}

  &amp;lt;/div&amp;gt;
  &amp;lt;textarea id=&amp;quot;fsEditor&amp;quot; spellcheck=&amp;quot;false&amp;quot;&amp;gt;&amp;lt;/textarea&amp;gt;
&amp;lt;/div&amp;gt;

&amp;lt;!-- TOAST --&amp;gt;
&amp;lt;div class=&amp;quot;toast&amp;quot; id=&amp;quot;toast&amp;quot;&amp;gt;&amp;lt;/div&amp;gt;

&amp;lt;script&amp;gt;
// ═══════════════════════════════════════
// CHAVES localStorage
// ═══════════════════════════════════════
const K_SNIPPETS  = 'pg_snippets_v4';
const K_AUTOSAVE  = 'pg_autosave_v4';
const K_CURRID    = 'pg_current_id_v4';
const K_APIKEY    = 'pg_apikey_v4';
const K_PROVIDER  = 'pg_provider_v4';
const K_SYSPROMPT = 'pg_sysprompt_v4';

const DEFAULT_SYSTEM = `Você é uma IA integrada a um editor de código. O usuário é Saulo, advogado de Manhumirim-MG.
REGRAS:
1. NUNCA peça desculpas ou use frases de empatia.
2. Vá direto ao ponto.
3. Ao alterar código: devolva o arquivo COMPLETO atualizado entre triple backticks.
4. Diga em uma linha o que mudou, depois o código.
5. Ao final: &amp;quot;Quer mais alguma alteração?&amp;quot;`;

// ═══════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════
let state = {
  mode: 'html',
  activeTab: 'html',
  currentId: null,
  title: 'Sem titulo',
  html: `&amp;lt;div style=&amp;quot;max-width:600px;margin:40px auto;padding:20px;font-family:sans-serif;&amp;quot;&amp;gt;
  &amp;lt;h1 style=&amp;quot;color:#333;&amp;quot;&amp;gt;Playground IA — Saulo&amp;lt;/h1&amp;gt;
  &amp;lt;p style=&amp;quot;color:#666;margin:16px 0;&amp;quot;&amp;gt;Importe um arquivo, cole código ou peça para a IA criar algo.&amp;lt;/p&amp;gt;
  &amp;lt;button onclick=&amp;quot;alert('Funcionou!')&amp;quot; style=&amp;quot;padding:10px 24px;font-size:16px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;&amp;quot;&amp;gt;Testar&amp;lt;/button&amp;gt;
&amp;lt;/div&amp;gt;`,
  css: '',
  js: '// JavaScript aqui\nconsole.log(&amp;quot;Playground IA — Saulo&amp;quot;);',
  jsx: `function App() {
  const [n, setN] = React.useState(0);
  return (
    &amp;lt;div style={{padding:40,fontFamily:'sans-serif',textAlign:'center'}}&amp;gt;
      &amp;lt;h1&amp;gt;⚛️ React Playground&amp;lt;/h1&amp;gt;
      &amp;lt;p&amp;gt;Contador: &amp;lt;strong&amp;gt;{n}&amp;lt;/strong&amp;gt;&amp;lt;/p&amp;gt;
      &amp;lt;button onClick={()=&amp;gt;setN(n+1)} style={{padding:'10px 24px',fontSize:16,background:'#3b82f6',color:'white',border:'none',borderRadius:8,cursor:'pointer'}}&amp;gt;+1&amp;lt;/button&amp;gt;
    &amp;lt;/div&amp;gt;
  );
}`,
  python: `# Python — output aparece no preview
dados = [&amp;quot;João Silva&amp;quot;, &amp;quot;Maria Souza&amp;quot;, &amp;quot;Pedro Lima&amp;quot;]
print(&amp;quot;=== CLIENTES ===&amp;quot;)
for i, nome in enumerate(dados, 1):
    print(f&amp;quot;{i}. {nome}&amp;quot;)
print(f&amp;quot;\\nTotal: {len(dados)}&amp;quot;)`,
};

// Carrega autosave
try {
  const sv = localStorage.getItem(K_AUTOSAVE);
  if (sv) Object.assign(state, JSON.parse(sv));
} catch(e){}

state.currentId = localStorage.getItem(K_CURRID) || null;

let apiKey    = localStorage.getItem(K_APIKEY)    || '';
let provider  = localStorage.getItem(K_PROVIDER)  || 'gemini';
let sysPrompt = localStorage.getItem(K_SYSPROMPT) || DEFAULT_SYSTEM;
let autoPreview = true;
let previewTimer = null;
let previewMinimized = false;
let quickEditMode = false;
let quickEditSelection = null;

// ═══════════════════════════════════════
// DOM
// ═══════════════════════════════════════
const editor       = document.getElementById('editor');
const previewFrame = document.getElementById('previewFrame');
const lineNumbers  = document.getElementById('lineNumbers');
const titleInput   = document.getElementById('projectTitle');

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
titleInput.value = state.title;
updateTabs();
loadEditorContent();
updatePreview();

// ═══════════════════════════════════════
// EVENTOS DO EDITOR
// ═══════════════════════════════════════
editor.addEventListener('input', () =&amp;gt; {
  saveCurrentTab();
  updateLineNumbers();
  autoSave();
  if (autoPreview) {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(updatePreview, 500);
  }
});

editor.addEventListener('scroll', () =&amp;gt; {
  lineNumbers.scrollTop = editor.scrollTop;
});

editor.addEventListener('keydown', e =&amp;gt; {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = editor.selectionStart, end = editor.selectionEnd;
    editor.value = editor.value.substring(0,s) + '  ' + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = s + 2;
    saveCurrentTab();
  }
  // Ctrl+Q para edição rápida
  if ((e.ctrlKey||e.metaKey) &amp;amp;&amp;amp; e.key === 'q') {
    e.preventDefault();
    startQuickEdit();
  }
});

editor.addEventListener('paste', () =&amp;gt; {
  setTimeout(() =&amp;gt; {
    const c = editor.value;
    if (state.mode === 'html') {
      if (/import\s+React|from\s+['&amp;quot;]react['&amp;quot;]|useState|&amp;lt;[A-Z][a-zA-Z]*[\s/&amp;gt;]/.test(c)) {
        switchMode('react'); state.jsx = c; loadEditorContent(); showToast('⚛️ React detectado!'); return;
      }
      if (/^(def |class |import |from |print\()/im.test(c) &amp;amp;&amp;amp; !c.includes('&amp;lt;')) {
        switchMode('python'); state.python = c; loadEditorContent(); showToast('🐍 Python detectado!'); return;
      }
    }
    saveCurrentTab(); updatePreview();
  }, 50);
});

// Clique duplo para edição rápida
editor.addEventListener('dblclick', () =&amp;gt; {
  startQuickEdit();
});

titleInput.addEventListener('input', () =&amp;gt; { state.title = titleInput.value; autoSave(); });

// ═══════════════════════════════════════
// EDITOR — FUNÇÕES
// ═══════════════════════════════════════
function updateLineNumbers() {
  const lines = editor.value.split('\n').length;
  document.getElementById('lineCount').textContent = lines + ' linhas';
  lineNumbers.textContent = Array.from({length:lines},(_,i)=&amp;gt;i+1).join('\n');
}

function saveCurrentTab() {
  const t = state.activeTab;
  if (state.mode==='react'&amp;amp;&amp;amp;t==='jsx') state.jsx=editor.value;
  else if (state.mode==='python'&amp;amp;&amp;amp;t==='python') state.python=editor.value;
  else if (t==='html') state.html=editor.value;
  else if (t==='css')  state.css=editor.value;
  else if (t==='js')   state.js=editor.value;
}

function loadEditorContent() {
  const t = state.activeTab;
  if (state.mode==='react'&amp;amp;&amp;amp;t==='jsx') editor.value=state.jsx;
  else if (state.mode==='python'&amp;amp;&amp;amp;t==='python') editor.value=state.python;
  else if (t==='html') editor.value=state.html;
  else if (t==='css')  editor.value=state.css;
  else if (t==='js')   editor.value=state.js;
  else editor.value='';
  updateLineNumbers();
}

function switchTab(tab) {
  saveCurrentTab();
  state.activeTab = tab;
  document.querySelectorAll('.tab').forEach(t=&amp;gt;t.classList.remove('active'));
  const el = document.getElementById('tab_'+tab);
  if (el) el.classList.add('active');
  loadEditorContent();
}

function updateTabs() {
  const c = document.getElementById('tabsContainer');
  const b = document.getElementById('modeBadge');
  if (state.mode==='html') {
    c.innerHTML = `
      &amp;lt;button class=&amp;quot;tab ${state.activeTab==='html'?'active':''}&amp;quot; id=&amp;quot;tab_html&amp;quot; onclick=&amp;quot;switchTab('html')&amp;quot;&amp;gt;📄 HTML&amp;lt;/button&amp;gt;
      &amp;lt;button class=&amp;quot;tab ${state.activeTab==='css'?'active':''}&amp;quot; id=&amp;quot;tab_css&amp;quot; onclick=&amp;quot;switchTab('css')&amp;quot;&amp;gt;🎨 CSS&amp;lt;/button&amp;gt;
      &amp;lt;button class=&amp;quot;tab ${state.activeTab==='js'?'active':''}&amp;quot; id=&amp;quot;tab_js&amp;quot; onclick=&amp;quot;switchTab('js')&amp;quot;&amp;gt;⚙️ JS&amp;lt;/button&amp;gt;`;
    b.className='badge badge-html'; b.textContent='HTML';
  } else if (state.mode==='react') {
    c.innerHTML = `
      &amp;lt;button class=&amp;quot;tab ${state.activeTab==='jsx'?'active':''}&amp;quot; id=&amp;quot;tab_jsx&amp;quot; onclick=&amp;quot;switchTab('jsx')&amp;quot;&amp;gt;⚛️ JSX&amp;lt;/button&amp;gt;
      &amp;lt;button class=&amp;quot;tab ${state.activeTab==='css'?'active':''}&amp;quot; id=&amp;quot;tab_css&amp;quot; onclick=&amp;quot;switchTab('css')&amp;quot;&amp;gt;🎨 CSS&amp;lt;/button&amp;gt;`;
    b.className='badge badge-react'; b.textContent='REACT';
  } else {
    c.innerHTML = `&amp;lt;button class=&amp;quot;tab active&amp;quot; id=&amp;quot;tab_python&amp;quot; onclick=&amp;quot;switchTab('python')&amp;quot;&amp;gt;🐍 Python&amp;lt;/button&amp;gt;`;
    b.className='badge badge-python'; b.textContent='PYTHON';
  }
}

function switchMode(mode) {
  saveCurrentTab();
  state.mode = mode;
  document.querySelectorAll('.btn-mode').forEach(b=&amp;gt;b.classList.remove('active'));
  document.getElementById('mode'+mode.charAt(0).toUpperCase()+mode.slice(1)).classList.add('active');
  if (mode==='html') state.activeTab='html';
  else if (mode==='react') state.activeTab='jsx';
  else state.activeTab='python';
  updateTabs(); loadEditorContent(); updatePreview(); autoSave();
}

// ═══════════════════════════════════════
// EDIÇÃO RÁPIDA
// ═══════════════════════════════════════
function startQuickEdit() {
  const start = editor.selectionStart;
  const end = editor.selectionEnd;
  
  if (start === end) {
    showToast('⚠️ Selecione um trecho para editar');
    return;
  }
  
  quickEditSelection = { start, end };
  quickEditMode = true;
  document.getElementById('quickEditBar').style.display = 'flex';
  document.getElementById('quickEditInput').focus();
  showToast('✏️ Modo edição rápida ativado');
}

function applyQuickEdit() {
  if (!quickEditSelection) return;
  
  const instruction = document.getElementById('quickEditInput').value.trim();
  if (!instruction) {
    showToast('⚠️ Digite uma instrução');
    return;
  }
  
  const selectedText = editor.value.substring(quickEditSelection.start, quickEditSelection.end);
  const before = editor.value.substring(0, quickEditSelection.start);
  const after = editor.value.substring(quickEditSelection.end);
  
  // Aqui você pode chamar a IA para alterar o trecho
  // Por enquanto, vou fazer uma alteração simples como exemplo
  const modified = `/* ${instruction} */\n${selectedText}`;
  
  editor.value = before + modified + after;
  saveCurrentTab();
  updateLineNumbers();
  autoSave();
  updatePreview();
  
  cancelQuickEdit();
  showToast('✅ Trecho atualizado!');
}

function cancelQuickEdit() {
  quickEditMode = false;
  quickEditSelection = null;
  document.getElementById('quickEditBar').style.display = 'none';
  document.getElementById('quickEditInput').value = '';
  editor.focus();
}

// ═══════════════════════════════════════
// PREVIEW MINIMIZÁVEL

function togglePreviewSize() {
  previewMinimized = !previewMinimized;

}

// ═══════════════════════════════════════
// PREVIEW
// ═══════════════════════════════════════
function buildDocument() {
  if (state.mode==='react') {
    return `&amp;lt;!DOCTYPE html&amp;gt;&amp;lt;html&amp;gt;&amp;lt;head&amp;gt;&amp;lt;meta charset=&amp;quot;UTF-8&amp;quot;&amp;gt;
&amp;lt;script crossorigin src=&amp;quot;https://unpkg.com/react@18/umd/react.development.js&amp;quot;&amp;gt;&amp;lt;\/script&amp;gt;
&amp;lt;script crossorigin src=&amp;quot;https://unpkg.com/react-dom@18/umd/react-dom.development.js&amp;quot;&amp;gt;&amp;lt;\/script&amp;gt;
&amp;lt;script src=&amp;quot;https://unpkg.com/@babel/standalone/babel.min.js&amp;quot;&amp;gt;&amp;lt;\/script&amp;gt;
&amp;lt;style&amp;gt;*{box-sizing:border-box}body{margin:0;font-family:sans-serif}${state.css}&amp;lt;/style&amp;gt;
&amp;lt;/head&amp;gt;&amp;lt;body&amp;gt;&amp;lt;div id=&amp;quot;root&amp;quot;&amp;gt;&amp;lt;/div&amp;gt;
&amp;lt;script type=&amp;quot;text/babel&amp;quot;&amp;gt;
const {useState,useEffect,useRef,useCallback,useMemo,Fragment}=React;
${state.jsx}
try{ReactDOM.createRoot(document.getElementById('root')).render(&amp;lt;App/&amp;gt;)}
catch(e){document.getElementById('root').innerHTML='&amp;lt;div style=&amp;quot;color:red;padding:20px;font-family:monospace&amp;quot;&amp;gt;Erro: '+e.message+'&amp;lt;/div&amp;gt;'}
&amp;lt;\/script&amp;gt;&amp;lt;/body&amp;gt;&amp;lt;/html&amp;gt;`;
  }
  if (state.mode==='python') {
    const esc = state.python.replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/&amp;lt;\/script&amp;gt;/g,'&amp;lt;\\/script&amp;gt;');
    return `&amp;lt;!DOCTYPE html&amp;gt;&amp;lt;html&amp;gt;&amp;lt;head&amp;gt;&amp;lt;meta charset=&amp;quot;UTF-8&amp;quot;&amp;gt;
&amp;lt;style&amp;gt;body{margin:0;background:#0f172a;color:#e2e8f0;font-family:'Consolas',monospace;padding:20px}#out{white-space:pre-wrap;font-size:13px;line-height:1.6}.ok{color:#4ade80}.err{color:#f87171}.ld{color:#60a5fa}&amp;lt;/style&amp;gt;
&amp;lt;/head&amp;gt;&amp;lt;body&amp;gt;&amp;lt;div id=&amp;quot;out&amp;quot;&amp;gt;&amp;lt;span class=&amp;quot;ld&amp;quot;&amp;gt;⟳ Carregando Python...&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;
&amp;lt;script src=&amp;quot;https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js&amp;quot;&amp;gt;&amp;lt;\/script&amp;gt;
&amp;lt;script&amp;gt;
async function run(){
  const out=document.getElementById('out');
  try{
    const py=await loadPyodide();
    py.runPython('import sys\\nfrom io import StringIO\\nsys.stdout=StringIO()');
    py.runPython(\`${esc}\`);
    const r=py.runPython('sys.stdout.getvalue()');
    out.innerHTML='&amp;lt;span class=&amp;quot;ok&amp;quot;&amp;gt;$ python3&amp;lt;/span&amp;gt;\\n'+r;
  }catch(e){out.innerHTML='&amp;lt;span class=&amp;quot;err&amp;quot;&amp;gt;Erro: '+e.message+'&amp;lt;/span&amp;gt;';}
}run();
&amp;lt;\/script&amp;gt;&amp;lt;/body&amp;gt;&amp;lt;/html&amp;gt;`;
  }
  const lower = state.html.trim().toLowerCase();
  if (lower.includes('&amp;lt;!doctype')||(lower.includes('&amp;lt;html')&amp;amp;&amp;amp;lower.includes('&amp;lt;/html&amp;gt;'))) return state.html;
  return `&amp;lt;!DOCTYPE html&amp;gt;&amp;lt;html&amp;gt;&amp;lt;head&amp;gt;&amp;lt;meta charset=&amp;quot;UTF-8&amp;quot;&amp;gt;&amp;lt;meta name=&amp;quot;viewport&amp;quot; content=&amp;quot;width=device-width,initial-scale=1.0&amp;quot;&amp;gt;
&amp;lt;style&amp;gt;${state.css}&amp;lt;/style&amp;gt;&amp;lt;/head&amp;gt;&amp;lt;body&amp;gt;
${state.html}
&amp;lt;script&amp;gt;${state.js}&amp;lt;\/script&amp;gt;&amp;lt;/body&amp;gt;&amp;lt;/html&amp;gt;`;

function updatePreview() {
  document.getElementById('previewStatus').textContent = 'atualizando...';

function toggleAuto() {

// AUTOSAVE

function autoSave() {
  try {
    localStorage.setItem(K_AUTOSAVE, JSON.stringify(state));

    setTimeout(()=&amp;gt;el.textContent='',1500);

// ═══════════════════════════════════════
// SALVAR / ABRIR PROJETOS
// ═══════════════════════════════════════
function getSnippets() {
  try { return JSON.parse(localStorage.getItem(K_SNIPPETS)||'[]'); } catch { return []; }
}
function setSnippets(list) {
  localStorage.setItem(K_SNIPPETS, JSON.stringify(list));
}

function saveProject() {
  saveCurrentTab();
  const snippets = getSnippets();
  const now = new Date().toISOString();
  let id = state.currentId;

  if (!id) {
    id = Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    state.currentId = id;
    localStorage.setItem(K_CURRID, id);
  }

  const item = {
    id,
    title: state.title || 'Sem titulo',
    mode: state.mode,
    activeTab: state.activeTab,
    html: state.html, css: state.css, js: state.js,
    jsx: state.jsx, python: state.python,
    updatedAt: now
  };

  const idx = snippets.findIndex(s=&amp;gt;s.id===id);
  if (idx&amp;gt;=0) {
    item.createdAt = snippets[idx].createdAt || snippets[idx].updatedAt || now;
    snippets[idx] = item;
    showToast('💾 Projeto atualizado!');
  } else {
    item.createdAt = now;
    snippets.unshift(item);
    showToast('💾 Projeto salvo!');
  }

  setSnippets(snippets);
  autoSave();
}

function saveAsNew() {
  state.currentId = null;
  localStorage.removeItem(K_CURRID);
  saveProject();
}

function openSavedModal() {
  document.getElementById('savedModal').classList.add('open');
  document.getElementById('searchInput').value='';
  renderSaved();
}
function closeSavedModal() {
  document.getElementById('savedModal').classList.remove('open');
}

function renderSaved() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const list = getSnippets().filter(s=&amp;gt;s.title.toLowerCase().includes(q));
  const c = document.getElementById('savedList');
  if (!list.length) {
    c.innerHTML='&amp;lt;p style=&amp;quot;text-align:center;color:var(--text2);font-size:12px;padding:20px;&amp;quot;&amp;gt;Nenhum projeto salvo ainda.&amp;lt;br&amp;gt;Clique em 💾 Salvar para guardar o atual.&amp;lt;/p&amp;gt;';
    return;
  }
  c.innerHTML = list.map(s=&amp;gt;`
    &amp;lt;div class=&amp;quot;sitem&amp;quot; onclick=&amp;quot;loadProject('${s.id}')&amp;quot;&amp;gt;
      &amp;lt;div&amp;gt;
        &amp;lt;div class=&amp;quot;sitem-name&amp;quot;&amp;gt;${esc(s.title)}&amp;lt;/div&amp;gt;
        &amp;lt;div class=&amp;quot;sitem-meta&amp;quot;&amp;gt;${s.mode||'html'} • ${fmtDate(s.updatedAt||s.createdAt)}&amp;lt;/div&amp;gt;
      &amp;lt;/div&amp;gt;
      &amp;lt;div class=&amp;quot;sitem-actions&amp;quot;&amp;gt;
        &amp;lt;button class=&amp;quot;btn-icon&amp;quot; onclick=&amp;quot;event.stopPropagation();renameProject('${s.id}')&amp;quot; title=&amp;quot;Renomear&amp;quot;&amp;gt;✏️&amp;lt;/button&amp;gt;
        &amp;lt;button class=&amp;quot;btn-icon&amp;quot; onclick=&amp;quot;event.stopPropagation();deleteProject('${s.id}')&amp;quot; title=&amp;quot;Excluir&amp;quot;&amp;gt;🗑️&amp;lt;/button&amp;gt;
      &amp;lt;/div&amp;gt;
    &amp;lt;/div&amp;gt;`).join('');
}

function loadProject(id) {
  const s = getSnippets().find(x=&amp;gt;x.id===id);
  if (!s) return;

  state.currentId = s.id;
  localStorage.setItem(K_CURRID, s.id);

  state.title   = s.title   || 'Sem titulo';
  state.mode    = s.mode    || 'html';
  state.activeTab = s.activeTab || (s.mode==='react'?'jsx':s.mode==='python'?'python':'html');
  state.html    = s.html    || '';
  state.css     = s.css     || '';
  state.js      = s.js      || '';
  state.jsx     = s.jsx     || '';
  state.python  = s.python  || '';

  titleInput.value = state.title;

  document.querySelectorAll('.btn-mode').forEach(b=&amp;gt;b.classList.remove('active'));
  const mb = document.getElementById('mode'+state.mode.charAt(0).toUpperCase()+state.mode.slice(1));
  if (mb) mb.classList.add('active');

  updateTabs();
  loadEditorContent();
  updatePreview();
  autoSave();
  closeSavedModal();
  showToast('📂 &amp;quot;'+state.title+'&amp;quot; aberto!');
}

function deleteProject(id) {
  if (!confirm('Excluir este projeto?')) return;
  setSnippets(getSnippets().filter(s=&amp;gt;s.id!==id));
  if (state.currentId===id) { state.currentId=null; localStorage.removeItem(K_CURRID); }
  renderSaved();
  showToast('🗑️ Excluído!');
}

function renameProject(id) {
  const list = getSnippets();
  const s = list.find(x=&amp;gt;x.id===id);
  if (!s) return;

document.getElementById('fileInput').addEventListener('change', e =&amp;gt; {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev =&amp;gt; {
    const content = ev.target.result;
    const ext = file.name.split('.').pop().toLowerCase();
    const name = file.name.replace(/\.[^.]+$/,'');

    if (ext==='csv') {
      // Importar CSV
      importCSV(content);
      return;
    }

    if (ext==='py') { switchMode('python'); state.python=content; }
    else if (ext==='jsx'||ext==='tsx') { switchMode('react'); state.jsx=content; }
    else if (ext==='css') { state.css=content; if(state.mode==='html') switchTab('css'); }
    else if (ext==='js') { state.js=content; if(state.mode==='html') switchTab('js'); }
    else {
      const lower=content.trim().toLowerCase();
      switchMode('html');
      state.html=content; state.css=''; state.js='';
    }

    state.title=name; titleInput.value=name;
    loadEditorContent(); updatePreview(); autoSave();
    showToast('📂 &amp;quot;'+file.name+'&amp;quot; importado!');
  };
  reader.readAsText(file);
  e.target.value='';
});

function importCSV(csvContent) {
  try {
    const lines = csvContent.trim().split('\n');
    if (lines.length &amp;lt; 2) {
      showToast('⚠️ CSV inválido');
      return;
    }
    
    const snippets = getSnippets();
    let imported = 0;
    
    for (let i = 1; i &amp;lt; lines.length; i++) {
      const line = lines[i];
      const parts = parseCSVLine(line);
      
      if (parts.length &amp;gt;= 6) {
        const item = {
          id: parts[0],
          title: parts[1],
          html: parts[2],
          css: parts[3],
          js: parts[4],
          mode: parts[5],
          jsx: '',
          python: '',
          activeTab: 'html',
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
        
        const idx = snippets.findIndex(s =&amp;gt; s.id === item.id);
        if (idx &amp;gt;= 0) {
          snippets[idx] = item;
        } else {
          snippets.push(item);
        }
        imported++;
      }
    }
    
    setSnippets(snippets);
    showToast(`✅ ${imported} projeto(s) importado(s)!`);
  } catch (err) {
    showToast('❌ Erro ao importar CSV: ' + err.message);
  }
}

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  
  for (let i = 0; i &amp;lt; line.length; i++) {
    const char = line[i];
    
    if (char === '&amp;quot;') {
      inQuotes = !inQuotes;
    } else if (char === ';' &amp;amp;&amp;amp; !inQuotes) {
      result.push(current);
      current = '';
    } else {
      current += char;
    }
  }
  
  result.push(current);
  return result;
}
